        - generic [ref=f3e112]:
          - heading [level=1] [ref=f3e113]:
            - link "Overview & Philosophy" [ref=f3e114] [cursor=pointer]:
              - /url: "#overview--philosophy"
            - button "Copy Anchor Link" [ref=f3e115]
          - heading [level=2] [ref=f3e119]:
            - link "Introduction to Fragola" [ref=f3e120] [cursor=pointer]:
              - /url: "#introduction-to-fragola"
            - button "Copy Anchor Link" [ref=f3e121]
          - paragraph [ref=f3e125]: Fragola is an event-driven SDK for building AI-first software and custom agents. Unlike heavy orchestration frameworks that force you into fixed directed acyclic graphs (DAGs) or black-box workflows, Fragola focuses on predictable state, explicit lifecycles, and a minimal set of powerful primitives.
          - paragraph [ref=f3e126]: Whether you are building a simple chat interface, a complex multi-agent orchestration system, or integrating external tools via the Model Context Protocol (MCP), Fragola provides the control and visibility you need to build production-ready AI applications.
          - heading [level=2] [ref=f3e127]:
            - link "Why Fragola?" [ref=f3e128] [cursor=pointer]:
              - /url: "#why-fragola"
            - button "Copy Anchor Link" [ref=f3e129]
          - paragraph [ref=f3e133]: "When building AI applications, developers often face a trade-off between inflexible high-level frameworks and boilerplate-heavy low-level API wrappers. Fragola bridges this gap with three core principles:"
          - list [ref=f3e134]:
            - listitem [ref=f3e135]:
              - strong [ref=f3e136]: "Predictable State:"
              - text: State is explicitly managed and mutable only through well-defined events. You always know exactly what is in the conversation history and what the agent is currently doing (
              - code [ref=f3e137]: idle
              - text: ","
              - code [ref=f3e138]: generating
              - text: ", or"
              - code [ref=f3e139]: waiting
              - text: ).
            - listitem [ref=f3e140]:
              - strong [ref=f3e141]: "Minimal Building Blocks:"
              - text: "Instead of abstract \"chains\" or \"graphs\", Fragola gives you concrete pieces: Agents, Tools, Stores, Events, and Hooks. These components snap together cleanly, giving you ultimate flexibility to build the architecture your product actually needs."
            - listitem [ref=f3e142]:
              - strong [ref=f3e143]: "Extensible Hooks:"
              - text: Need to add logging, safety guardrails, human-in-the-loop approvals, or connect to an MCP server? You don't need a massive framework plugin. Fragola's hook system allows you to package standard event listeners and scoped stores into reusable, pluggable behaviors.
          - heading [level=2] [ref=f3e144]:
            - link "Architecture at a Glance" [ref=f3e145] [cursor=pointer]:
              - /url: "#architecture-at-a-glance"
            - button "Copy Anchor Link" [ref=f3e146]
          - paragraph [ref=f3e150]: "The Fragola SDK is built around a few central concepts working in harmony:"
          - list [ref=f3e151]:
            - listitem [ref=f3e152]:
              - strong [ref=f3e153]: "Agent:"
              - text: The core loop. It maintains state (messages, step count, execution status) and handles the turn-by-turn interactions with the LLM.
            - listitem [ref=f3e154]:
              - strong [ref=f3e155]: "Events:"
              - text: Explicit lifecycle interceptors (e.g.,
              - code [ref=f3e156]: onUserMessage
              - text: ","
              - code [ref=f3e157]: onBeforeModelInvocation
              - text: ","
              - code [ref=f3e158]: onToolCall
              - text: ). Events drive the agent's workflow and allow you to pause, mutate, or observe operations at any stage.
            - listitem [ref=f3e159]:
              - strong [ref=f3e160]: "Context:"
              - text: The
              - code [ref=f3e161]: AgentContext
              - text: exposes the agent's state, tools, and scoped instructions to handlers, tools, and hooks, allowing them to dynamically interact with the execution flow.
            - listitem [ref=f3e162]:
              - strong [ref=f3e163]: "Stores:"
              - text: Reactive state containers (
              - code [ref=f3e164]: global
              - text: ","
              - code [ref=f3e165]: local
              - text: ", or"
              - code [ref=f3e166]: scoped
              - text: ). Stores track data outside of the LLM context (like retrieved documents, user sessions, or metrics) and let you watch for changes reactively.
            - listitem [ref=f3e167]:
              - strong [ref=f3e168]: "Hooks:"
              - text: Functions that receive an agent and attach behaviors. Fragola provides powerful built-in hook presets (like
              - code [ref=f3e169]: mcp-client
              - text: ","
              - code [ref=f3e170]: guardrail
              - text: ", and"
              - code [ref=f3e171]: orchestration
              - text: ), but creating your own is as simple as registering an event listener.
        - link [ref=f3e173] [cursor=pointer]:
          - /url: /docs/installation
