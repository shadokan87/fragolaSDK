        - generic [ref=f5e112]:
          - heading [level=1] [ref=f5e113]:
            - link "Overview & Philosophy" [ref=f5e114] [cursor=pointer]:
              - /url: "#overview--philosophy"
            - button "Copy Anchor Link" [ref=f5e115]
          - heading [level=2] [ref=f5e119]:
            - link "Introduction to Fragola" [ref=f5e120] [cursor=pointer]:
              - /url: "#introduction-to-fragola"
            - button "Copy Anchor Link" [ref=f5e121]
          - paragraph [ref=f5e125]: Fragola is an event-driven SDK for building AI-first software and custom agents. Unlike heavy orchestration frameworks that force you into fixed directed acyclic graphs (DAGs) or black-box workflows, Fragola focuses on predictable state, explicit lifecycles, and a minimal set of powerful primitives.
          - paragraph [ref=f5e126]: Whether you are building a simple chat interface, a complex multi-agent orchestration system, or integrating external tools via the Model Context Protocol (MCP), Fragola provides the control and visibility you need to build production-ready AI applications.
          - heading [level=2] [ref=f5e127]:
            - link "Why Fragola?" [ref=f5e128] [cursor=pointer]:
              - /url: "#why-fragola"
            - button "Copy Anchor Link" [ref=f5e129]
          - paragraph [ref=f5e133]: "When building AI applications, developers often face a trade-off between inflexible high-level frameworks and boilerplate-heavy low-level API wrappers. Fragola bridges this gap with three core principles:"
          - list [ref=f5e134]:
            - listitem [ref=f5e135]:
              - strong [ref=f5e136]: "Predictable State:"
              - text: State is explicitly managed and mutable only through well-defined events. You always know exactly what is in the conversation history and what the agent is currently doing (
              - code [ref=f5e137]: idle
              - text: ","
              - code [ref=f5e138]: generating
              - text: ", or"
              - code [ref=f5e139]: waiting
              - text: ).
            - listitem [ref=f5e140]:
              - strong [ref=f5e141]: "Minimal Building Blocks:"
              - text: "Instead of abstract \"chains\" or \"graphs\", Fragola gives you concrete pieces: Agents, Tools, Stores, Events, and Hooks. These components snap together cleanly, giving you ultimate flexibility to build the architecture your product actually needs."
            - listitem [ref=f5e142]:
              - strong [ref=f5e143]: "Extensible Hooks:"
              - text: Need to add logging, safety guardrails, human-in-the-loop approvals, or connect to an MCP server? You don't need a massive framework plugin. Fragola's hook system allows you to package standard event listeners and scoped stores into reusable, pluggable behaviors.
          - heading [level=2] [ref=f5e144]:
            - link "Architecture at a Glance" [ref=f5e145] [cursor=pointer]:
              - /url: "#architecture-at-a-glance"
            - button "Copy Anchor Link" [ref=f5e146]
          - paragraph [ref=f5e150]: "The Fragola SDK is built around a few central concepts working in harmony:"
          - list [ref=f5e151]:
            - listitem [ref=f5e152]:
              - strong [ref=f5e153]: "Agent:"
              - text: The core loop. It maintains state (messages, step count, execution status) and handles the turn-by-turn interactions with the LLM.
            - listitem [ref=f5e154]:
              - strong [ref=f5e155]: "Events:"
              - text: Explicit lifecycle interceptors (e.g.,
              - code [ref=f5e156]: onUserMessage
              - text: ","
              - code [ref=f5e157]: onBeforeModelInvocation
              - text: ","
              - code [ref=f5e158]: onToolCall
              - text: ). Events drive the agent's workflow and allow you to pause, mutate, or observe operations at any stage.
            - listitem [ref=f5e159]:
              - strong [ref=f5e160]: "Context:"
              - text: The
              - code [ref=f5e161]: AgentContext
              - text: exposes the agent's state, tools, and scoped instructions to handlers, tools, and hooks, allowing them to dynamically interact with the execution flow.
            - listitem [ref=f5e162]:
              - strong [ref=f5e163]: "Stores:"
              - text: Reactive state containers (
              - code [ref=f5e164]: global
              - text: ","
              - code [ref=f5e165]: local
              - text: ", or"
              - code [ref=f5e166]: scoped
              - text: ). Stores track data outside of the LLM context (like retrieved documents, user sessions, or metrics) and let you watch for changes reactively.
            - listitem [ref=f5e167]:
              - strong [ref=f5e168]: "Hooks:"
              - text: Functions that receive an agent and attach behaviors. Fragola provides powerful built-in hook presets (like
              - code [ref=f5e169]: mcp-client
              - text: ","
              - code [ref=f5e170]: guardrail
              - text: ", and"
              - code [ref=f5e171]: orchestration
              - text: ), but creating your own is as simple as registering an event listener.
        - link [ref=f5e173] [cursor=pointer]:
          - /url: /docs/installation
